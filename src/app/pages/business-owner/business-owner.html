<!-- Legacy page (route /business-owner, not linked from the app). The live trader dashboard is /trader. -->
<h2 class="welcome-title">Welcome back{{ userName ? ', ' + userName : '' }}!</h2>
<p class="welcome-subtitle">
    Your trade licences and applications are on your dashboard.
</p>

<!-- Quick Actions -->
<div class="quick-actions">
    <a class="quick-card text-decoration-none text-reset" routerLink="/trader/new-licenses">
        <div class="quick-icon warning">
        <i class="bi bi-plus"></i>
        </div>
        <h6>Apply for New License</h6>
        <p>Start a new trade license application</p>
    </a>

    <a class="quick-card text-decoration-none text-reset" routerLink="/trader">
        <div class="quick-icon success">
        <i class="bi bi-card-checklist"></i>
        </div>
        <h6>My Licenses</h6>
        <p>View your licences and download certificates</p>
    </a>

    <a class="quick-card text-decoration-none text-reset" routerLink="/trader/track-application">
        <div class="quick-icon primary">
        <i class="bi bi-geo-alt"></i>
        </div>
        <h6>Track Application</h6>
        <p>Check application status</p>
    </a>
</div>
