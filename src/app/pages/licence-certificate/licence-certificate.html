<div class="license-certificate-page">
  <div class="page-actions">
    <button class="btn btn-outline-secondary" (click)="goBack()">
      Back to Application
    </button>
    <button class="btn btn-secondary" [disabled]="loading || resolvingTemplate" (click)="printCertificate()">Print</button>
    <button class="btn btn-primary" [disabled]="loading || resolvingTemplate" (click)="downloadPdf()">Download</button>
    <button
      *ngIf="showSaveButton"
      class="btn btn-success"
      [disabled]="isSaving || loading || resolvingTemplate"
      (click)="saveGeneratedCertificate()"
    >
      {{ isSaving ? 'Saving...' : 'Save Licence' }}
    </button>
  </div>

  <div *ngIf="loading" class="loading-state">Loading certificate...</div>
  <div *ngIf="!loading && errorMessage" class="error-state">{{ errorMessage }}</div>
  <div *ngIf="!loading && !errorMessage && resolvingTemplate" class="loading-state">Preparing certificate...</div>

  <!-- GBA corporation-specific design (page 1 of the corporation's reference PDF) -->
  <app-gba-certificate
    *ngIf="!loading && !errorMessage && !resolvingTemplate && gbaTemplate && gbaData"
    [template]="gbaTemplate"
    [data]="gbaData"
  ></app-gba-certificate>

  <!-- Legacy BBMP design for licences without a GBA corporation (unchanged) -->
  <app-licence-template
    *ngIf="!loading && !errorMessage && !resolvingTemplate && !gbaTemplate"
    [wardName]="viewModel.wardName"
    [corporationName]="viewModel.corporationName"
    [licenceNo]="viewModel.licenceNo"
    [applicationNo]="viewModel.applicationNo"
    [financialYear]="viewModel.financialYear"
    [applicantName]="viewModel.applicantName"
    [licenceDate]="viewModel.licenceDate"
    [tradeName]="viewModel.tradeName"
    [tradeAddress]="viewModel.tradeAddress"
    [sanctionedPower]="viewModel.sanctionedPower"
    [majorTrade]="viewModel.majorTrade"
    [minorTrade]="viewModel.minorTrade"
    [subTrade]="viewModel.subTrade"
    [validUpto]="viewModel.validUpto"
    [feesPaid]="viewModel.feesPaid"
    [paymentMode]="viewModel.paymentMode"
    [receiptNo]="viewModel.receiptNo"
    [paymentDate]="viewModel.paymentDate"
    [renewBefore]="viewModel.renewBefore"
    [qrCodeOrCertificateHash]="viewModel.qrCodeOrCertificateHash"
  ></app-licence-template>
</div>
