<div class="dashboard-wrapper">

  <!-- ================= TOP BAR ================= -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo-box">
        <i class="bi bi-building"></i>
      </div>
      <div>
        <div class="title">GBA Trade License</div>
        <small class="subtitle">Trader Portal</small>
      </div>
    </div>

    <div class="topbar-right">
      <div class="user-info" *ngIf="userName">
        <div class="name">{{ userName }}</div>
      </div>
    </div>
  </header>

  <!-- ================= BODY ================= -->
  <div class="dashboard-body">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">
      <nav class="menu">
            <a
                class="menu-item"
                routerLink="/trader"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
            >
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a
                class="menu-item"
                routerLink="/trader/new-licenses"
                routerLinkActive="active"
            >
                <i class="bi bi-plus-circle"></i>
                New Application
            </a>

            <a
                class="menu-item"
                routerLink="/trader/track-application"
                routerLinkActive="active"
            >
                <i class="bi bi-clock-history"></i>
                Applications
            </a>
        </nav>


      <div class="sidebar-footer">
        <button class="signout-btn" (click)="logout()">
          <i class="bi bi-box-arrow-right"></i>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- ================= MAIN CONTENT ================= -->
    
  </div>
</div>
